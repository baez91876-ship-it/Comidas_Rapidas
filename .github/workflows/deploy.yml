name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: hoy/package-lock.json

      - name: Install dependencies
        working-directory: hoy
        run: npm ci

      - name: Build
        working-directory: hoy
        run: npm run build

      - name: Prepare docs folder
        shell: bash
        run: |
          rm -rf docs
          mkdir -p docs
          cp -R hoy/dist/spa/. docs/
          touch docs/.nojekyll

      - name: Publish docs folder
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No docs changes to publish"
          else
            git commit -m "Deploy site to docs [skip ci]"
            git push
          fi